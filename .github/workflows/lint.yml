name: PSScriptAnalyzer

on:
  push:
    paths: ['**.ps1', '**.psd1', 'tests/**', '.github/workflows/lint.yml']
  pull_request:
    paths: ['**.ps1', '**.psd1', 'tests/**']

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Parse check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = 0
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object FullName -notmatch '\\tests\\' | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed++; Write-Host "PARSE FAIL $($_.FullName)"; $errors | ForEach-Object { Write-Host "  $($_.Message) line $($_.Extent.StartLineNumber)" } }
          }
          if ($failed) { exit 1 }
          Write-Host "All scripts parse under Windows PowerShell 5.1"

      - name: Pester conventions
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5
          $r = Invoke-Pester -Path ./tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 | Where-Object ScriptPath -notmatch '\\tests\\'
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          $bad = $results | Where-Object Severity -in 'Error','Warning'
          if ($bad) { Write-Host "$($bad.Count) warning(s) or error(s)"; exit 1 }
          Write-Host "Clean"
